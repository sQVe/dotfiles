comment_tab_width = 2
comment_vim = true
diff_view = "side-by-side"
ignore_whitespace = true
no_update_check = true
scroll_offset = 8
theme = "catppuccin-latte-sel"

comment_types = [
  { id = "issue", definition = "must fix: bug, crash, race, invalid output, or missing test/guard/error state", color = "#d20f39" },
  { id = "suggestion", definition = "should consider: simpler, shorter, or matches an existing pattern or helper", color = "#1e66f5" },
  { id = "question", definition = "genuine ask for clarification; no change implied", color = "#8839ef" },
]

[forge]
comment_type_prefix = false
