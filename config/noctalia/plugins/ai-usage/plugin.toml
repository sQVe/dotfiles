id          = "sqve/ai-usage"
name        = "AI usage"
version     = "1.0.0"
plugin_api  = 14
author      = "sqve"
license     = "MIT"
icon        = "brain"
description = "One AI plan usage window per capsule, from the ai-usagebar CLI."
tags         = ["bar", "ai", "indicator"]
# The CLI owns credentials, endpoints and caching. This plugin runs
# `ai-usagebar usage --json` once per cycle and draws one window from it.
dependencies = ["ai-usagebar"]

[[setting]]
key           = "refresh_minutes"
type          = "int"
label_key     = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default       = 5
min           = 1
max           = 120

# One poller for the whole shell: `usage --json` returns every vendor at once,
# so three capsules still cost one process per cycle.
[[service]]
id    = "poller"
entry = "service.luau"

[[widget]]
id    = "bar"
entry = "widget.luau"

[[widget.setting]]
key           = "vendor"
type          = "string"
label_key     = "settings.vendor.label"
description_key = "settings.vendor.description"
default       = "anthropic"

[[widget.setting]]
key           = "window"
type          = "string"
label_key     = "settings.window.label"
description_key = "settings.window.description"
default       = ""
